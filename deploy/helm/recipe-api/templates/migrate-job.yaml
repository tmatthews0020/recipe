apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "recipe-api.fullname" . }}-migrate
  labels:
    {{- include "recipe-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "recipe-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--migrate"]
          envFrom:
            - configMapRef:
                name: {{ include "recipe-api.fullname" . }}-config
            - secretRef:
                name: {{ include "recipe-api.fullname" . }}-db
