apiVersion: v1
kind: Secret
metadata:
  name: {{ include "recipe-api.fullname" . }}-db
  labels:
    {{- include "recipe-api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-1"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: {{ required "database.connectionString is required" .Values.database.connectionString | quote }}
